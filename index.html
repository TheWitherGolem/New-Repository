<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Omnissiah Academy — AdMech &amp; 40k 11th Edition Trainer</title>
<style>
  :root {
    --bg: #12100e;
    --panel: #1c1917;
    --panel2: #242019;
    --border: #3b332a;
    --text: #e8e0d4;
    --muted: #a89f90;
    --red: #b5342c;
    --red-bright: #e05545;
    --brass: #c9a961;
    --green: #6fae6f;
    --blue: #6f9dae;
    --code-bg: #2a2622;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Georgia, 'Times New Roman', serif;
    line-height: 1.6;
  }
  a { color: var(--brass); }

  /* Layout */
  #app { display: flex; min-height: 100vh; }
  #sidebar {
    width: 280px; min-width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    padding: 1.2rem 0.8rem;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  #content { flex: 1; padding: 2rem 3rem; max-width: 900px; }

  .logo { text-align: center; margin-bottom: 1.2rem; }
  .logo .cog { font-size: 2.2rem; color: var(--red-bright); }
  .logo h1 { font-size: 1.05rem; color: var(--brass); letter-spacing: 0.08em; text-transform: uppercase; }
  .logo p { font-size: 0.75rem; color: var(--muted); font-style: italic; }

  .nav-group { margin-bottom: 0.9rem; }
  .nav-group-title {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); padding: 0.3rem 0.6rem;
  }
  .nav-item {
    display: flex; align-items: center; gap: 0.5rem;
    width: 100%; text-align: left;
    background: none; border: none; color: var(--text);
    font-family: inherit; font-size: 0.92rem;
    padding: 0.45rem 0.6rem; border-radius: 6px; cursor: pointer;
  }
  .nav-item:hover { background: var(--panel2); }
  .nav-item.active { background: var(--red); color: #fff; }
  .nav-item .done-mark { margin-left: auto; color: var(--green); font-size: 0.8rem; }

  h2 { color: var(--red-bright); font-size: 1.7rem; margin-bottom: 0.3rem; }
  h3 { color: var(--brass); font-size: 1.2rem; margin: 1.6rem 0 0.5rem; }
  h4 { color: var(--text); font-size: 1rem; margin: 1.1rem 0 0.3rem; }
  .subtitle { color: var(--muted); font-style: italic; margin-bottom: 1.4rem; }
  p { margin-bottom: 0.8rem; }
  ul, ol { margin: 0 0 0.9rem 1.4rem; }
  li { margin-bottom: 0.35rem; }
  strong { color: var(--brass); }
  em { color: var(--text); }

  .callout {
    background: var(--panel); border-left: 4px solid var(--brass);
    padding: 0.8rem 1rem; border-radius: 0 8px 8px 0; margin: 1rem 0;
  }
  .callout.warn { border-left-color: var(--red-bright); }
  .callout.tip { border-left-color: var(--green); }
  .callout .label {
    font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--muted); display: block; margin-bottom: 0.2rem;
  }

  table { border-collapse: collapse; margin: 0.8rem 0 1.2rem; width: 100%; font-size: 0.92rem; }
  th, td { border: 1px solid var(--border); padding: 0.45rem 0.7rem; text-align: left; }
  th { background: var(--panel); color: var(--brass); }
  tr:nth-child(even) td { background: var(--panel); }
  .table-wrap { overflow-x: auto; }

  code {
    background: var(--code-bg); padding: 0.1rem 0.35rem; border-radius: 4px;
    font-family: 'Courier New', monospace; font-size: 0.88em; color: var(--brass);
  }

  /* Quiz */
  .quiz { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; margin: 1.5rem 0; }
  .quiz h3 { margin-top: 0; }
  .quiz-q { margin-bottom: 1.1rem; }
  .quiz-q .qtext { font-weight: bold; margin-bottom: 0.4rem; }
  .quiz-opt {
    display: block; width: 100%; text-align: left;
    background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 0.45rem 0.7rem; margin-bottom: 0.35rem;
    font-family: inherit; font-size: 0.92rem; cursor: pointer;
  }
  .quiz-opt:hover { border-color: var(--brass); }
  .quiz-opt.correct { border-color: var(--green); background: #24301f; }
  .quiz-opt.wrong { border-color: var(--red-bright); background: #33201d; }
  .quiz-opt:disabled { cursor: default; }
  .quiz-explain { font-size: 0.88rem; color: var(--muted); margin: 0.3rem 0 0; display: none; }
  .quiz-explain.show { display: block; }
  .quiz-score { font-weight: bold; color: var(--brass); margin-top: 0.5rem; }

  /* Calculator */
  .calc { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 1.2rem; margin: 1.2rem 0; }
  .calc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.7rem; margin-bottom: 0.8rem; }
  .calc label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 0.15rem; }
  .calc input, .calc select {
    width: 100%; background: var(--panel2); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px; padding: 0.35rem 0.5rem;
    font-family: inherit; font-size: 0.95rem;
  }
  .calc-result { background: var(--panel2); border-radius: 8px; padding: 0.8rem 1rem; font-size: 0.95rem; }
  .calc-result .big { color: var(--red-bright); font-size: 1.3rem; font-weight: bold; }
  .calc button, .btn {
    background: var(--red); color: #fff; border: none; border-radius: 6px;
    padding: 0.5rem 1.1rem; font-family: inherit; font-size: 0.95rem; cursor: pointer;
  }
  .calc button:hover, .btn:hover { background: var(--red-bright); }

  .footer-note { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--border); font-size: 0.8rem; color: var(--muted); }
  .pager { display: flex; justify-content: space-between; margin-top: 2.2rem; gap: 1rem; }
  .pager .btn { background: var(--panel2); border: 1px solid var(--border); color: var(--text); }
  .pager .btn:hover { border-color: var(--brass); }

  #menu-toggle { display: none; }
  @media (max-width: 800px) {
    #app { flex-direction: column; }
    #sidebar { width: 100%; min-width: 0; height: auto; position: static; display: none; }
    #sidebar.open { display: block; }
    #content { padding: 1.2rem; }
    #menu-toggle {
      display: block; position: sticky; top: 0; z-index: 10;
      width: 100%; background: var(--red); color: #fff; border: none;
      padding: 0.7rem; font-family: inherit; font-size: 1rem; cursor: pointer;
    }
  }
</style>
</head>
<body>
<button id="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">⚙ Menu</button>
<div id="app">
  <nav id="sidebar">
    <div class="logo">
      <div class="cog">⚙</div>
      <h1>Omnissiah Academy</h1>
      <p>AdMech &amp; 11th Edition Trainer</p>
    </div>
    <div id="nav"></div>
  </nav>
  <main id="content"></main>
</div>

{
  id: 'start', group: 'Getting Started', title: 'How to Use This App',

    </div>
  `

{
  id: 'stats', group: 'Core Rules', title: 'Reading Stats & Datasheets', quiz: 'stats',
  html: `
    <h2>Reading Stats &amp; Datasheets</h2>
    <p class="subtitle">Every model is a bundle of numbers. Learn to read them and half the game opens up.</p>
    <p>Every unit has a <strong>datasheet</strong>: its characteristics, weapons, abilities, and keywords. Here's what the numbers mean.</p>
    <h3>Model characteristics</h3>
    <div class="table-wrap"><table>
      <tr><th>Stat</th><th>Name</th><th>What it does</th><th>AdMech example</th></tr>
      <tr><td><code>M</code></td><td>Move</td><td>How far the model moves in inches in the Movement phase.</td><td>Skitarii are ordinary on foot; Sulphurhounds and Ironstriders are fast.</td></tr>
      <tr><td><code>T</code></td><td>Toughness</td><td>How hard the model is to wound. Compared against the attacker's Strength.</td><td>Skitarii are fragile (low T); Kastelan Robots are genuinely tough.</td></tr>
      <tr><td><code>Sv</code></td><td>Save</td><td>The d6 roll needed to shrug a wound. Lower is better. AP makes it worse.</td><td>Skitarii carry a mediocre save — they live on cover and positioning, not armour.</td></tr>
      <tr><td><code>W</code></td><td>Wounds</td><td>Damage a model soaks before it dies.</td><td>1–2 on infantry, lots on Kastelans and tanks.</td></tr>
      <tr><td><code>Ld</code></td><td>Leadership</td><td>Target for morale-style tests (Battle-shock and similar).</td><td>—</td></tr>
      <tr><td><code>OC</code></td><td>Objective Control</td><td>How much "control" each model exerts when contesting a location. A unit with 0 OC can't hold anything.</td><td>Cheap Skitarii bodies exist substantially to project OC.</td></tr>
    </table></div>
    <h3>Weapon characteristics</h3>
    <div class="table-wrap"><table>
      <tr><th>Stat</th><th>Name</th><th>What it does</th></tr>
      <tr><td><code>Range</code></td><td>Range</td><td>Maximum distance in inches. "Melee" means fight phase only.</td></tr>
      <tr><td><code>A</code></td><td>Attacks</td><td>Number of dice you roll to hit.</td></tr>
      <tr><td><code>BS/WS</code></td><td>Ballistic / Weapon Skill</td><td>The roll needed to hit (ranged / melee). 3+ means a 3 or higher on a d6.</td></tr>
      <tr><td><code>S</code></td><td>Strength</td><td>Compared to the target's Toughness to see what you need to wound.</td></tr>
      <tr><td><code>AP</code></td><td>Armour Penetration</td><td>Worsens the target's save. AP-2 turns a 4+ save into a 6+.</td></tr>
      <tr><td><code>D</code></td><td>Damage</td><td>Wounds inflicted per failed save. D2 kills a 2-wound model with one failed save.</td></tr>
    </table></div>
    <h3>The attack sequence</h3>
    <ol>
      <li><strong>Hit roll</strong> — roll <code>A</code> dice, needing <code>BS/WS</code> or better. 11th edition adds situational modifiers: shooting at a unit <em>in terrain</em> is at −1 BS, and shooting from an elevated position grants +1 BS ("Plunging Fire").</li>
      <li><strong>Wound roll</strong> — compare <code>S</code> to <code>T</code>:</li>
    </ol>
    <div class="table-wrap"><table>
      <tr><th>Comparison</th><th>Wound on</th></tr>
      <tr><td>S at least double T</td><td>2+</td></tr>
      <tr><td>S greater than T</td><td>3+</td></tr>
      <tr><td>S equals T</td><td>4+</td></tr>
      <tr><td>S less than T</td><td>5+</td></tr>
      <tr><td>S half T or less</td><td>6+</td></tr>
    </table></div>
    <ol start="3">
      <li><strong>Saving throw</strong> — defender rolls <code>Sv</code>, modified by <code>AP</code>. An <em>invulnerable save</em> ignores AP but never improves. Cover helps the armour save of units in terrain.</li>
      <li><strong>Damage</strong> — each failed save inflicts <code>D</code> wounds. Excess damage from one attack does not spill into the next model.</li>
    </ol>
    <div class="callout tip">
      <span class="label">AdMech takeaway</span>
      AdMech units usually have <em>weak individual stats</em> and strong <em>force multipliers</em> — imperatives, detachment rules, leaders, and stratagems that push those mediocre dice up a notch. Reading a datasheet as "base stats + every buff I can legally stack this phase" is the core AdMech skill.
    </div>
    <h3>Mathhammer trainer</h3>
    <p>Use this calculator to build intuition. Try a squad of 10 Skitarii Rangers (30 shots with three ranger rifles' worth of extras is a common profile-check) against T5 infantry, then flip a +1 to hit on and watch the output jump ~25–50%. That jump <em>is</em> the AdMech army rule in numeric form.</p>
    <div class="calc" id="mathhammer"></div>
  `

  id: 'turns', group: 'Core Rules', title: 'Turn Structure & Phases', quiz: 'turns',
  html: `
    <h2>Turn Structure &amp; Phases</h2>
    <p class="subtitle">A battle is five battle rounds. Each round, both players take a turn made of phases.</p>
    <h3>The phases of your turn</h3>
    <ol>
      <li><strong>Command phase</strong> — gain Command Points (CP), resolve start-of-turn effects, make Battle-shock tests. For AdMech this is where big army decisions land (e.g. your Doctrina Imperative stance for the round).</li>
      <li><strong>Movement phase</strong> — move, Advance (extra d6" but usually no shooting), Fall Back (leave combat), or Remain Stationary. Units arriving from Reserves show up here.</li>
      <li><strong>Shooting phase</strong> — units shoot eligible targets, respecting the new terrain and Hidden rules (next module).</li>
      <li><strong>Charge phase</strong> — declare charges, roll 2d6, and move into <strong>Engagement Range — which is now 2"</strong> in 11th edition (up from 1"). This makes charges slightly easier to complete and makes screening units cover more space.</li>
      <li><strong>Fight phase</strong> — combats resolve. 11th edition restructured this phase around <strong>alternating activations</strong> (players trade unit activations rather than one side swinging everything) with <strong>pooled saves</strong>. The upshot: you can no longer count on your whole side swinging before the enemy answers, so committing multiple cheap units matters more than one giant blob.</li>
    </ol>
    <h3>Movement freedoms new to 11th</h3>
    <ul>
      <li>All units can move <strong>through friendly units</strong> freely — your Rangers no longer form a wall that traps your own Ironstriders.</li>
      <li><strong>Rotating a model is free</strong> — no more measuring the pivot of a Dunecrawler's hull.</li>
    </ul>
    <div class="callout tip">
      <span class="label">AdMech takeaway</span>
      Art of War's core AdMech thesis is <em>"movement and positioning first, damage second."</em> Free movement through friendlies and free rotation directly reward the dense, layered AdMech infantry formations that were awkward to shuffle in 10th. Practice moving your whole army as one choreographed machine — the phase structure is your metronome.
    </div>
  `
},

{
  id: 'eleventh', group: 'Core Rules', title: "11th Edition's Big Changes", quiz: 'eleventh',
  html: `
    <h2>11th Edition's Big Changes</h2>
    <p class="subtitle">Released 20 June 2026 (Armageddon box). Free Core Rules PDF. Your 10th edition codex is still legal.</p>
    <p>If you learned any 10th edition, here is what changed. If you're brand new, these are the rules veterans are most likely to get wrong — knowing them is free equity.</p>
    <h3>1. Detachment Points (DP)</h3>
    <p>Armies no longer pick exactly one detachment. You have a <strong>DP budget — 2 DP at 1,000 points, 3 DP at 2,000 points</strong> — and each detachment costs 1–3 DP. So at 2,000 points you might run one powerhouse 3 DP detachment, or stack a 2 DP + 1 DP pair, or even three 1 DP detachments. This is the single biggest list-building change in the edition and the heart of current AdMech list debates (see the Detachments module).</p>
    <h3>2. Terrain actually hides you</h3>
    <ul>
      <li>Shooting at a unit <strong>in terrain</strong> suffers <strong>−1 BS</strong>.</li>
      <li><strong>Plunging Fire</strong>: shooting from an elevated position grants <strong>+1 BS</strong>.</li>
      <li><strong>Hidden</strong>: Infantry, Beast, and Swarm units in cover that haven't recently fired gain Hidden status — enemies more than <strong>15"</strong> away simply <em>cannot target them</em>.</li>
    </ul>
    <h3>3. Engagement range is 2"</h3>
    <p>Charges, screens, pile-ins, and consolidations all changed texture. A screening line needs fewer models to deny the same area, and tag-charges reach further.</p>
    <h3>4. Objectives became actions</h3>
    <p>Fixed objective markers are gone from missions. Instead units perform <strong>special actions</strong> — holding terrain features, clearing locations of enemies, and similar mission tasks. Cheap durable units that can afford to spend their turn doing actions are more valuable than ever.</p>
    <h3>5. Stratagem discipline</h3>
    <p>A unit can benefit from <strong>only one stratagem per phase</strong> — and Command Re-roll counts. Nearly every stratagem was rewritten, and effects that made stratagems free now reduce cost by 1 CP instead. Full detail in the Stratagems module.</p>
    <h3>6. Fight phase: alternating activations, pooled saves</h3>
    <p>Combat is a back-and-forth of unit activations with a pooled-save resolution, not "my whole army swings, then yours."</p>
    <h3>7. Backwards compatibility</h3>
    <p>10th edition codexes remain legal — the free <strong>Faction Packs</strong> (AdMech got one with three new detachments) layer 11th edition content on top, and old detachments received DP costs.</p>
    <div class="callout tip">
      <span class="label">AdMech takeaway</span>
      Almost every one of these changes is <em>good for you</em>. Your army is mostly Infantry (Hidden status), lives in cover (−1 to be hit), floods cheap OC bodies (action-based missions), and wants granular multi-unit play (alternating fights, one-strat-per-unit). 11th edition rewards exactly the patient, positional game AdMech was already forced to play.
    </div>
  `
},

{
  id: 'strats', group: 'Core Rules', title: 'CP & Stratagems', quiz: 'strats',
  html: `
    <h2>Command Points &amp; Stratagems</h2>
    <p class="subtitle">Your once-per-phase trump cards. 11th edition made every one of them a real decision.</p>
    <h3>The economy</h3>
    <ul>
      <li>You gain CP each Command phase and spend them on <strong>stratagems</strong> — one-shot rule breaks printed in the core rules and your detachments.</li>
      <li><strong>The one-stratagem rule:</strong> a unit can benefit from only <em>one</em> stratagem in any given phase. Command Re-roll is a stratagem, so "buff this unit AND re-roll its charge" is no longer legal in the same phase. This killed 10th edition's stacked "blender unit" turns.</li>
      <li>Effects that used to make stratagems free now just <strong>reduce cost by 1 CP</strong>.</li>
      <li>Detachments vary in how many stratagems they carry — some have several, some none. A detachment's stratagem list is part of its price.</li>
    </ul>
    <h3>How to think about stratagems (the skill, not the list)</h3>
    <ol>
      <li><strong>Sequencing beats hoarding.</strong> Since each unit gets one stratagem per phase, plan <em>which unit</em> gets <em>which effect</em> in <em>which phase</em> before you start rolling. Good players narrate this to themselves in the Command phase.</li>
      <li><strong>Save 1 CP for disaster insurance</strong> when a single roll (a charge, a critical save) can swing the game — but remember using Command Re-roll on a unit locks that unit out of other stratagems that phase.</li>
      <li><strong>Defensive strats are usually worth more than offensive ones.</strong> Damage you prevent keeps scoring bodies alive; damage you add is often overkill.</li>
    </ol>

{
  id: 'identity', group: 'Your Army', title: 'AdMech Identity & Army Rule', quiz: 'identity',
  html: `
    <h2>AdMech Identity &amp; Army Rule</h2>
    <p class="subtitle">The Adeptus Mechanicus: cheap bodies, layered buffs, and a plan for every phase.</p>
    <h3>What kind of army is this?</h3>
    <p>Richard Siegler (Art of War's AdMech coach and 2025 World Champion with the faction) describes AdMech as an army about <strong>buffing relatively cheap units to do specialized tasks or punch above their weight</strong> — a faction that gets into winning positions <strong>through movement and positioning first, damage second</strong>. Nothing in your list is individually scary. The <em>combination</em> — the right imperative, the right terrain, the right stratagem, on the right unit, at the right time — is scary.</p>
    <p>Practical consequences:</p>
    <ul>
      <li>You will usually have <strong>more units</strong> than your opponent. That's more activations in the alternating fight phase, more action-doers for missions, more screens — and more chances to make sequencing mistakes. AdMech is widely rated as one of the <strong>steepest learning curves</strong> in the game. That's the price of its ceiling.</li>
      <li>You <strong>trade</strong>, you don't brawl. Offer cheap units, take valuable ones, and win on the mission while the opponent wins the highlight reel.</li>
      <li>Your damage is <strong>volume-based</strong>: many mid-strength shots plus buffs, rather than few giant hits.</li>
    </ul>
    <h3>Army rule: Doctrina Imperatives</h3>
    <p>Your army rule (carried forward from the 10th edition codex into 11th) is <strong>Doctrina Imperatives</strong> — each battle round you broadcast a stance to your Skitarii:</p>
    <ul>
      <li><strong>Protector Imperative</strong> — a ranged-discipline stance: Skitarii shooting improves when they hold position (their guns behave as Heavy — rewarding stationary fire).</li>

      <li><strong>Reserve deliberately.</strong> Pteraxii and similar arrive later where the game will be, not where it is.</li>
    </ul>

// ============================================================
// APP ENGINE
// ============================================================
const PROGRESS_KEY = 'omnissiah-progress-v1';
function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch { return {}; }
}
function saveProgress(p) { localStorage.setItem(PROGRESS_KEY, JSON.stringify(p)); }

let currentId = location.hash.replace('#', '') || 'start';
if (!LESSONS.some(l => l.id === currentId)) currentId = 'start';

function renderNav() {
  const progress = loadProgress();
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  let lastGroup = null, groupDiv = null;
  for (const lesson of LESSONS) {
    if (lesson.group !== lastGroup) {
      lastGroup = lesson.group;
      groupDiv = document.createElement('div');
      groupDiv.className = 'nav-group';
      groupDiv.innerHTML = `<div class="nav-group-title">${lesson.group}</div>`;
      nav.appendChild(groupDiv);
    }
    const btn = document.createElement('button');
    btn.className = 'nav-item' + (lesson.id === currentId ? ' active' : '');
    const done = lesson.quiz && progress[lesson.quiz] && progress[lesson.quiz].passed;
    btn.innerHTML = `<span>${lesson.title}</span>` + (done ? '<span class="done-mark">✓</span>' : '');
    btn.onclick = () => { show(lesson.id); document.getElementById('sidebar').classList.remove('open'); };
    groupDiv.appendChild(btn);
  }
}

function show(id) {
  currentId = id;
  location.hash = id;
  const lesson = LESSONS.find(l => l.id === id);
  const idx = LESSONS.findIndex(l => l.id === id);
  const content = document.getElementById('content');
  content.innerHTML = lesson.html;

  if (lesson.quiz) renderQuiz(lesson.quiz, content);

  // pager
  const pager = document.createElement('div');
  pager.className = 'pager';
  const prev = LESSONS[idx - 1], next = LESSONS[idx + 1];
  pager.innerHTML =
    (prev ? `<button class="btn" onclick="show('${prev.id}')">← ${prev.title}</button>` : '<span></span>') +
    (next ? `<button class="btn" onclick="show('${next.id}')">${next.title} →</button>` : '<span></span>');
  content.appendChild(pager);

  if (id === 'stats') renderCalculator();
  renderNav();
  window.scrollTo(0, 0);
}

// ---- Quiz engine ----
function renderQuiz(quizId, container) {
  const quiz = QUIZZES[quizId];
  if (!quiz) return;
  const progress = loadProgress();
  const box = document.createElement('div');
  box.className = 'quiz';
  const prior = progress[quizId];
  box.innerHTML = `<h3>${quiz.title}</h3>` +
    (prior ? `<p class="quiz-score">Best so far: ${prior.best}/${quiz.questions.length}${prior.passed ? ' — passed ✓' : ''}</p>` : '');
  let answered = 0, correct = 0;
  quiz.questions.forEach((q, qi) => {
    const qDiv = document.createElement('div');
    qDiv.className = 'quiz-q';
    qDiv.innerHTML = `<div class="qtext">${qi + 1}. ${q.q}</div>`;
    const explain = document.createElement('p');
    explain.className = 'quiz-explain';
    explain.textContent = q.why;
    const optBtns = [];
    const order = q.opts.map((_, i) => i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    order.forEach((oi, pos) => {
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.textContent = q.opts[oi];
      b.onclick = () => {
        optBtns.forEach(x => x.disabled = true);
        if (oi === q.a) { b.classList.add('correct'); correct++; }
        else { b.classList.add('wrong'); optBtns[order.indexOf(q.a)].classList.add('correct'); }
        explain.classList.add('show');
        answered++;
        if (answered === quiz.questions.length) finishQuiz(quizId, quiz, correct, box);
      };
      optBtns.push(b);
      qDiv.appendChild(b);
    });
    qDiv.appendChild(explain);
    box.appendChild(qDiv);
  });
  container.appendChild(box);
}

function finishQuiz(quizId, quiz, correct, box) {
  const total = quiz.questions.length;
  const passed = correct >= Math.ceil(total * 0.75);
  const progress = loadProgress();
  const prior = progress[quizId] || { best: 0, passed: false };
  progress[quizId] = { best: Math.max(prior.best, correct), passed: prior.passed || passed };
  saveProgress(progress);
  const result = document.createElement('p');
  result.className = 'quiz-score';
  result.textContent = passed
    ? `${correct}/${total} — the Omnissiah is pleased. Module complete. ✓`
    : `${correct}/${total} — recalibrate and retry (75% to pass). Reload the page to retake.`;
  box.appendChild(result);
  renderNav();
}

// ---- Mathhammer calculator ----
function renderCalculator() {
  const el = document.getElementById('mathhammer');
  if (!el) return;
  el.innerHTML = `
    <h4 style="margin-top:0">Expected damage calculator</h4>
    <div class="calc-grid">
      <div><label>Attacks</label><input id="c-a" type="number" value="20" min="1"></div>
      <div><label>Hit on (2–6)</label><input id="c-bs" type="number" value="4" min="2" max="6"></div>
      <div><label>Hit modifier</label><select id="c-mod"><option value="1">+1</option><option value="0" selected>0</option><option value="-1">−1</option></select></div>
      <div><label>Strength</label><input id="c-s" type="number" value="4" min="1"></div>
      <div><label>Toughness</label><input id="c-t" type="number" value="5" min="1"></div>
      <div><label>AP (0–6)</label><input id="c-ap" type="number" value="1" min="0" max="6"></div>
      <div><label>Save (2–7, 7=none)</label><input id="c-sv" type="number" value="4" min="2" max="7"></div>
      <div><label>Invuln (2–7, 7=none)</label><input id="c-inv" type="number" value="7" min="2" max="7"></div>
      <div><label>Damage per wound</label><input id="c-d" type="number" value="1" min="1"></div>
    </div>
    <button onclick="runCalc()">Calculate</button>
    <div class="calc-result" id="c-out" style="margin-top:0.8rem">Set your profile and calculate.</div>
  `;
  runCalc();
}

function runCalc() {
  const v = id => parseFloat(document.getElementById(id).value);
  const A = v('c-a'), bs = v('c-bs'), mod = v('c-mod'), S = v('c-s'), T = v('c-t'),
        AP = v('c-ap'), Sv = v('c-sv'), Inv = v('c-inv'), D = v('c-d');
  // hit: modified target clamped to 2..6 (nat 1 always fails, nat 6 always hits)
  const hitTarget = Math.min(6, Math.max(2, bs - mod));
  const pHit = (7 - hitTarget) / 6;
  // wound
  let wTarget;
  if (S >= 2 * T) wTarget = 2;
  else if (S > T) wTarget = 3;
  else if (S === T) wTarget = 4;
  else if (S * 2 <= T) wTarget = 6;
  else wTarget = 5;
  const pWound = (7 - wTarget) / 6;
  // save: best of modified armour vs invuln
  const armour = Math.min(7, Sv + AP);
  const saveTarget = Math.min(armour, Inv);
  const pFail = saveTarget >= 7 ? 1 : (saveTarget - 1) / 6;
  const hits = A * pHit, wounds = hits * pWound, unsaved = wounds * pFail, dmg = unsaved * D;
  document.getElementById('c-out').innerHTML =
    `Hits: <strong>${hits.toFixed(1)}</strong> (need ${hitTarget}+) → ` +
    `Wounds: <strong>${wounds.toFixed(1)}</strong> (need ${wTarget}+) → ` +
    `Unsaved: <strong>${unsaved.toFixed(1)}</strong> (save ${saveTarget >= 7 ? 'none' : saveTarget + '+'}) → ` +
    `<span class="big">${dmg.toFixed(1)} damage</span><br>` +
    `<span style="color:var(--muted);font-size:0.85rem">Averages over many dice — single games swing hard. Use this for target priority, not certainty.</span>`;
}

// ---- boot ----
window.addEventListener('hashchange', () => {
  const id = location.hash.replace('#', '');
  if (LESSONS.some(l => l.id === id) && id !== currentId) show(id);
});
renderNav();
show(currentId);
</script>
